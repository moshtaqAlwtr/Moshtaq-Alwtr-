    <!-- Resolve theme + language before first paint so the page never flashes -->
    <script>
      (function () {
        try {
          var d = document.documentElement
          var theme = localStorage.getItem('mw-theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          d.setAttribute('data-theme', theme)

          // Arabic is the default for first-time visitors regardless of browser
          // locale: the audience is Arabic-speaking, and many of them browse
          // with an English-locale device. English is one click away.
          var lang = localStorage.getItem('mw-lang')
          if (lang !== 'ar' && lang !== 'en') lang = 'ar'
          d.setAttribute('lang', lang)
          d.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr')
        } catch (e) {}
      })()
    </script>
